<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chord Room</title>
<meta name="description" content="BPM, key and chord detection, RGB DJ waveform, AI stem separation and MIDI export for FL Studio.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<link rel="stylesheet" href="assets/app.css?v=11">
<link rel="stylesheet" href="assets/dj.css?v=3">
<link rel="stylesheet" href="assets/shell.css?v=2">
<link rel="stylesheet" href="assets/pages.css?v=2">
<link rel="stylesheet" href="assets/a11y.css?v=2">
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <div class="mark">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect class="lbg" width="34" height="34" rx="4"/><g class="lfg"><rect x="7" y="14" width="2.4" height="6" rx="1"/><rect x="11" y="10" width="2.4" height="14" rx="1"/><rect x="15" y="6" width="2.4" height="22" rx="1"/><rect x="19" y="11" width="2.4" height="12" rx="1"/><rect x="23" y="8" width="2.4" height="18" rx="1"/></g><rect class="lred" x="27" y="13" width="2.4" height="8" rx="1" fill="#E5322B"/></svg>
      <span class="wm">CHORD ROOM</span>
      <span class="tl" data-i="tagline"></span>
    </div>
    <div class="navwrap" id="navDrawer">
      <div class="dhd"><span class="dhd-t" id="navDrawerT"></span><button class="dclose" id="navClose" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <nav class="tabs" id="navTabs">
        <span class="tab-ind" aria-hidden="true"></span>
        <button type="button" id="navTool" class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/></svg><span data-i="navTool"></span></button>
        <button type="button" id="navDisc" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span data-i="navDisc"></span></button>
        <button type="button" id="navDj" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/></svg><span data-i="navDj"></span></button>
        <button type="button" id="navPricing" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l3 5-9 13L3 8z"/><path d="M3 8h18M9.5 3L12 8l2.5-5M12 8v13"/></svg><span data-i="navPricing"></span></button>
        <button type="button" id="navAbout" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg><span data-i="navAbout"></span></button>
      </nav>
      <div class="tools">
        <button class="btn ghost thm" id="themeBtn" type="button"><svg class="ic sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        <span class="langw"><svg class="lgl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><select class="sel" id="lang" aria-label="Language">
          <option value="he">עברית</option><option value="en">English</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="es">Español</option>
        </select></span>
        <button class="btn ghost" id="libBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span data-i="library"></span></button>
        <button class="btn ghost" id="adminBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg><span data-i="adminPanel"></span></button>
        <label class="btn solid up" for="file" tabindex="0" id="upLbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 16V4m0 0l-5 5m5-5l5 5M4 20h16"/></svg><span data-i="upload"></span></label>
        <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac">
      </div>
    </div>
    <div class="quick">
      <button id="creditsChip" class="credits" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="crCoinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB14A"/><stop offset=".55" stop-color="#FF7A1A"/><stop offset="1" stop-color="#B66DFF"/></linearGradient></defs><circle cx="12" cy="12" r="10" fill="url(#crCoinG)"/><circle cx="12" cy="12" r="7" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/><path d="M12 7.6l1.3 2.9 3.1.3-2.4 2.1.7 3.1-2.7-1.6-2.7 1.6.7-3.1-2.4-2.1 3.1-.3z" fill="#fff"/></svg><b id="creditsN">0</b><span data-i="creditsL"></span></button>
      <button class="btn ghost" id="signInBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-i="signIn"></span></button>
      <button class="avbtn" id="accBtn" type="button" hidden><img id="accImg" alt=""></button>
      <button class="burger" id="navBurger" type="button" aria-expanded="false" aria-controls="navDrawer"><span></span><span></span><span></span></button>
    </div>
  </div>
  <span class="top-glow" aria-hidden="true"></span>
  <div class="scrim" id="navScrim"></div>
</header>
<div class="banner" id="banner" hidden><b data-i="notice"></b><span id="bannerT"></span></div>

<main class="wrap" id="toolView">
  <section class="track" aria-live="polite">
    <div>
      <div class="eyebrow"><span data-i="loaded"></span><span class="sst" id="saveState" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></svg><span></span></span></div>
      <h1 id="tname">—</h1>
    </div>
    <div class="stats">
      <div class="stat adj" id="stBpm"><span class="k" data-i="bpmL"></span><span class="v vrow"><button type="button" class="nud" id="tmM" data-it="tempoDown">−</button><input class="vin" id="sBpm" value="—" inputmode="decimal" autocomplete="off" spellcheck="false" data-it="bpmEdit"><button type="button" class="nud" id="tmP" data-it="tempoUp">+</button></span><span class="s" id="sBpmS"></span></div>
      <div class="stat adj" id="stKey"><span class="k" data-i="key"></span><span class="v vrow"><button type="button" class="nud" id="kyM" data-it="keyDown">−</button><span class="vk" id="sKey">—</span><button type="button" class="nud" id="kyP" data-it="keyUp">+</button></span><span class="s" id="sKeyS"></span></div>
      <div class="stat"><span class="k" data-i="camelot"></span><span class="v"><span class="cam" id="sCam">—</span></span><span class="s"></span></div>
      <div class="stat"><span class="k" data-i="length"></span><span class="v" id="sDur">—</span><span class="s"></span></div>
      <div class="stat"><span class="k" data-i="loudness"></span><span class="v" id="sLufs">—</span><span class="s" id="sPeak"></span></div>
    </div>
  </section>

  <section class="deck">
    <canvas id="ov"></canvas>
    <canvas id="zm"></canvas>
    <div class="dbar">
      <button class="play" id="play" type="button">
        <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      </button>
      <div class="time" id="time">0:00.0 <span>/ 0:00</span></div>
      <div class="hc" id="hc"></div>
      <div class="grp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg><span class="lb" data-i="loop"></span><button type="button" data-lb="1">1</button><button type="button" data-lb="2">2</button><button type="button" data-lb="4">4</button><button type="button" data-lb="8">8</button><button type="button" id="loopBtn">⟲</button></div>
      <div class="grp"><button type="button" id="clickBtn" class="icb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l4 18H5z"/><path d="M12 15l5-8"/></svg><span data-i="click"></span></button></div>
      <span class="dspacer"></span>
      <div class="grp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h2M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/></svg><span class="lb" data-i="wave"></span><button type="button" class="wmb" data-wm="rgb" data-it="wmRgb"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="4" height="6" rx="1" fill="#FF4B4B"/><rect x="10" y="5" width="4" height="14" rx="1" fill="#3BE37A"/><rect x="17" y="8" width="4" height="8" rx="1" fill="#4B8BFF"/></svg></button><button type="button" class="wmb" data-wm="3band" data-it="wm3"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="3" rx="1.5" fill="#F2EFE6"/><rect x="3" y="10.5" width="18" height="3" rx="1.5" fill="#E08A1E"/><rect x="3" y="15" width="18" height="3" rx="1.5" fill="#1E62D0"/></svg></button><button type="button" class="wmb" data-wm="blue" data-it="wmMono"><svg viewBox="0 0 24 24"><path d="M2 12h2M5 9v6M8 6v12M11 8v8M14 4v16M17 8v8M20 10v4" stroke="#2A7FFF" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button><button type="button" class="wmb" data-wm="stems" data-it="wmStems" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="3.5" height="16" rx="1" fill="#FF4FA3"/><rect x="8" y="7" width="3.5" height="10" rx="1" fill="#FFC53D"/><rect x="13" y="9" width="3.5" height="6" rx="1" fill="#3D8BFF"/><rect x="18" y="6" width="3.5" height="12" rx="1" fill="#2BD46A"/></svg></button></div>
      <div class="grp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="lb" data-i="zoom"></span><button type="button" id="zOut">−</button><button type="button" id="zIn">+</button></div>
      <div class="grp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg><span class="lb">BPM</span><button type="button" id="bpmH">÷2</button><button type="button" id="bpmD">×2</button></div>
      <div class="grp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M9 4v16M14 4v16M19 4v16"/></svg><span class="lb" data-i="grid"></span><button type="button" id="gL">◀</button><button type="button" id="gR">▶</button><button type="button" id="gBar">1</button></div>
    </div>
    <div class="rack" id="rack">
      <div class="rhead">
        <div class="rtitle"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V14M4 10V3M12 21V12M12 8V3M20 21V16M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><b data-i="stemsTitle"></b><span class="engine" id="engine"><i class="edot"></i><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg><span></span></span></div>
        <div class="ractions">
          <button class="rbtn solid" type="button" id="aiBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span data-i="aiSep"></span><i class="cost" id="aiCost" hidden></i></button>
          <button class="rbtn" type="button" id="cancelBtn" data-i="cancel" hidden></button>
        </div>
      </div>
      <div class="sprog" id="sprog" hidden><div class="track2"><i id="sbar"></i></div><span id="smsg"></span></div>
      <p class="rnote" id="snote"></p>
      <div class="mixer" id="mixer"></div>
    </div>
    <div class="overlay" id="busy" hidden><div class="msg" id="busyMsg"></div><div class="pbar"><i id="busyBar"></i></div></div>
  </section>
  <div class="notice" id="notice" hidden></div>

  <div class="cols">
    <section>
      <h2 data-i="now"></h2>
      <div class="now">
        <div class="big" id="nowName">—</div>
        <div class="dia" id="nowDia"></div>
        <div class="next">
          <div><div class="k" data-i="next"></div><div class="nm" id="nextName">—</div><div class="w" id="nextWhen"></div></div>
          <div class="dia" id="nextDia"></div>
        </div>
      </div>
    </section>
    <section class="ctl">
      <h2 data-i="playAlong"></h2>
      <div class="crow"><div><div class="n" data-i="transpose"></div><div class="h" data-i="transposeH"></div></div>
        <div class="step"><button type="button" id="trM">−</button><output id="trV">0</output><button type="button" id="trP">+</button></div></div>
      <div class="crow"><div><div class="n" data-i="capo"></div><div class="h" id="capoH"></div></div>
        <div class="step"><button type="button" id="cpM">−</button><output id="cpV">0</output><button type="button" id="cpP">+</button></div></div>
      <div class="crow"><div class="n" data-i="diagrams"></div>
        <div class="seg"><button type="button" data-dg="guitar" data-i="guitar"></button><button type="button" data-dg="piano" data-i="piano"></button></div></div>
      <div class="crow"><div class="n" data-i="names"></div>
        <div class="seg"><button type="button" data-acc="0" data-i="auto"></button><button type="button" data-acc="1">♯</button><button type="button" data-acc="2">♭</button></div></div>
      <div class="crow"><div><div class="n" data-i="harmonic"></div><div class="h" data-i="harmonicH"></div></div>
        <div class="hcol"><div class="harm" id="harm" dir="ltr"></div><button class="lnk" type="button" id="findMatches" data-i="findMatches"></button></div></div>
    </section>
  </div>


  <section class="block">
    <div class="bhead"><h2 data-i="export"></h2><p data-i="exportH"></p></div>
    <div class="xlist" id="xlist"></div>
    <div class="xfmt" role="radiogroup" data-it="fmtT"><button type="button" data-fmt="wav" role="radio">WAV</button><button type="button" data-fmt="mp3" role="radio">MP3 320</button></div>
    <div class="xrow"><button class="btn solid" type="button" id="dlBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg><span data-i="download"></span></button><span class="xcost" id="dlCost" hidden></span><span class="snote" id="dlMsg"></span></div>
  </section>

  <section class="block">
    <div class="bhead"><h2 data-i="chordsIn"></h2></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="block">
    <div class="bhead"><h2 data-i="sheet"></h2>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="snote" id="sheetHint"></span><button class="btn ghost" type="button" id="editBtn" data-i="edit"></button></div></div>
    <div class="sheet" id="sheet"></div>
  </section>

  <footer>
    <div><h3 data-i="about"></h3><p data-i="aboutT" style="margin:0 0 8px"></p><p data-i="credits" style="margin:0"></p></div>
    <div><h3 data-i="keys"></h3><div class="keys" id="keys"></div></div>
  </footer>
</main>
<section class="wrap disc" id="discover" hidden>
  <div class="dhead">
    <div><div class="eyebrow" data-i="dEyebrow"></div><h1 data-i="dTitle"></h1><p data-i="dSub"></p></div>
  </div>
  <div class="dtabs" id="dTabs" role="tablist"></div>
  <div class="dfilters">
    <div class="dgen" id="dGenres"></div>
    <div class="dsel">
      <select class="sel" id="dKey" aria-label="Key"></select>
      <label class="bpmr"><span data-i="dBpm"></span><input type="number" id="dBpmMin" min="40" max="220" inputmode="numeric" data-ip="bpmMin"><span>–</span><input type="number" id="dBpmMax" min="40" max="220" inputmode="numeric" data-ip="bpmMax"></label>
    </div>
  </div>
  <p class="snote" id="dMsg"></p>
  <ol class="dlist" id="dList"></ol>
  <p class="snote dnote"><span data-i="dNote"></span> <span data-i="dSignIn"></span></p>
</section>
<section class="wrap dj" id="djView" hidden></section>
<section class="wrap page" id="pricingView" hidden></section>
<section class="wrap page" id="aboutView" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<aside class="lib" id="lib" hidden>
  <div class="hd"><h3 data-i="library"></h3><button class="btn ghost" id="libClose" type="button" data-i="close"></button></div>
  <p class="snote" data-i="libH" style="margin:0"></p>
  <ul id="libList"></ul>
</aside>
<div class="pop" id="pop" hidden></div>
<div class="fullbar" id="fullbar" hidden>
  <div class="fbh"><b id="fullTitle"></b><span class="snote" data-i="fullBarNote"></span><button class="btn ghost" id="fullClose" type="button" data-i="close"></button></div>
  <iframe id="fullFrame" title="Deezer" src="about:blank" allow="encrypted-media; autoplay; clipboard-write" loading="lazy"></iframe>
</div>
<aside class="mix" id="mix" hidden>
  <div class="hd"><h3 data-i="mixTitle"></h3><button class="btn ghost" id="mixClose" type="button" data-i="close"></button></div>
  <div class="mhead" id="mixHead"></div>
  <p class="snote" data-i="mixH"></p>
  <ul class="mlist" id="mixList"></ul>
</aside>

<aside class="acc" id="acc" hidden>
  <div class="hd"><h3 data-i="account"></h3><button class="btn ghost" id="accClose" type="button" data-i="close"></button></div>
  <div class="bd">
    <div class="who"><div class="ph"><img id="pImg" alt=""></div><div style="min-width:0"><div class="nm" id="pName"></div><div class="snote" id="pUser" dir="ltr" style="text-align:start"></div><span class="rl" id="pRole"></span></div></div>
    <div class="ptsbox" id="ptsBox" hidden><div class="ptsh"><div><span class="k" data-i="creditsBal"></span><b id="ptsN" class="mono" dir="ltr">0</b></div><button class="btn solid" type="button" id="ptsPlans" data-i="seePlans"></button></div><div class="snote" id="ptsPlan"></div><details class="ptslog"><summary data-i="creditsHist"></summary><ul id="ptsLog"></ul></details></div>
    <form id="pForm" class="fset" autocomplete="off">
      <div class="fld"><label data-i="photo"></label><div class="row2"><label class="btn ghost" for="pFile" tabindex="0" data-i="changePhoto"></label><button class="btn ghost" type="button" id="pRm" data-i="removePhoto"></button></div><input type="file" id="pFile" accept="image/*"></div>
      <div class="fld"><label for="pUname" data-i="username"></label><input type="text" id="pUname" dir="ltr" maxlength="24" pattern="[A-Za-z0-9_.\-]{3,24}"><span class="snote" data-i="usernameH"></span></div>
      <div class="fld"><label for="pNick" data-i="nick"></label><input type="text" id="pNick" maxlength="40"></div>
      <div class="fld"><label for="pBio" data-i="bio"></label><textarea id="pBio" maxlength="280"></textarea></div>
